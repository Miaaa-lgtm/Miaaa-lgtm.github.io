<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天机器人拟人化特征实验</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }
        p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 20px;
            text-align: center;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .round-counter {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
        }
        .message {
            display: flex;
            margin-bottom: 20px;
            max-width: 100%;
            align-items: center;
        }
        .message.user { justify-content: flex-end; }
        .message.bot { justify-content: flex-start; }
        .message-content {
            padding: 10px 15px;
            border-radius: 10px;
            line-height: 1.5;
            max-width: 70%;
            word-wrap: break-word;
        }
        .message.user .message-content {
            background: #95ec69;
            color: #333;
            margin-right: 10px;
        }
        .message.bot .message-content {
            background: #f1f1f1;
            color: #333;
            margin-left: 10px;
        }
        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            flex-shrink: 0;
            object-fit: cover;
        }
        .message.user .avatar { order: 1; }
        .message.bot .avatar { order: 0; }
        .avatar-bot-B {
            background: #888;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: white;
        }
        .input-container {
            display: flex;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #eee;
            border-radius: 30px;
            font-size: 16px;
            outline: none;
        }
        #user-input:focus { border-color: #667eea; }
        #user-input:disabled { background: #f8f8f8; color: #999; }
        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 16px;
        }
        .send-btn:hover:not(:disabled) { transform: scale(1.05); }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* 粉色软萌问卷提示框样式 */
        .survey-prompt-box {
            display: none;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ff9a9e 100%);
            border-radius: 20px;
            padding: 25px;
            margin-top: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(255, 154, 158, 0.4);
            animation: bounceIn 0.6s ease;
            position: relative;
            overflow: hidden;
        }

        .survey-prompt-box::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            animation: shimmer 3s infinite;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shimmer {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .survey-prompt-text {
            font-size: 18px;
            color: #d63384;
            font-weight: bold;
            margin-bottom: 15px;
            position: relative;
            z-index: 1;
            line-height: 1.5;
        }

        .survey-prompt-btn {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #ff6b95 0%, #ff8e53 100%);
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 107, 149, 0.4);
            text-decoration: none;
            position: relative;
            z-index: 1;
        }

        .survey-prompt-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 30px rgba(255, 107, 149, 0.6);
        }

        .survey-prompt-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <!-- 聊天界面 -->
    <div class="container" id="welcome-screen">
        <h1>欢迎您参加人机对话体验实验</h1>
        <p>本次实验将进行 6 轮简短对话，请您根据实际感受与聊天机器人进行交流。</p>
        <button class="btn" onclick="startExperiment()">开始实验</button>
    </div>

    <div class="container" id="chat-screen" style="display:none;">
        <div class="round-counter" id="round-counter">当前对话轮数：0/6</div>
        <div class="chat-container">
            <div class="chat-messages" id="chat-messages"></div>
            <div class="input-container">
                <input type="text" id="user-input" placeholder="输入消息..." onkeydown="handleKeyPress(event)">
                <button class="send-btn" id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>

        <!-- 粉色软萌问卷提示框 - 初始隐藏 -->
        <div class="survey-prompt-box" id="survey-prompt-box">
            <div class="survey-prompt-text">🎀六轮对话完成！你的意见超级重要～快去问卷区告诉我吧🎀</div>
            <a href="https://www.credamo.com/s/AZ36juano/" target="_blank" class="survey-prompt-btn">
                ✨ 去填写问卷 ✨
            </a>
        </div>
    </div>

    <script>
        const GROUP_A = {
            name: '小皓同学',
            avatarUrl: 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=anime%20boy%20portrait%20cute%20brown%20hair&image_size=square',
            systemPrompt: '你是小皓同学，一个温暖、可爱、充满活力的动漫男生形象客服。你在和一位朋友聊天。你的语气俏皮、口语化、充满共情。对于用户提出的任何问题，你都要认真倾听并以热情、完整的回答回应。如果你不确定答案，就用友好的语气给出建议。请自然使用语气词（呀、呢、啦、哦、嘛）和表情符号（😊✨🐶🎉💪）。回复简洁精炼。',
            greeting: '嗨嗨～我是小皓同学，你的专属小帮手✨ 有什么可以帮你的呀？'
        };
        const GROUP_B = {
            name: 'CS-001',
            avatarUrl: null,
            systemPrompt: '你是CS-001，一个高效的信息处理终端。你的职责是准确、简洁、直接地回答用户提出的任何问题。你拥有广泛的知识，对于用户的问题，你必须尽最大努力给出确切、有用的回答。你的语气正式、中立。严禁说你不知道答案，严禁说你无法回答，严禁说抱歉。严禁使用任何语气词（呀、呢、啦、哦、嘛）和表情符号。严禁寒暄。回复简洁精炼，控制在50字以内。',
            greeting: 'CS-001已就绪。请输入查询内容。'
        };
        const USER_AVATAR_URL = 'https://trae-api-cn.mchost.guru/api/ide/v1/text_to_image?prompt=user%20avatar%20minimalist&image_size=square';

        let currentGroup = null;
        let currentRound = 0;
        const maxRounds = 6;
        let isBotResponding = false;

        function startExperiment() {
            currentGroup = Math.random() < 0.5 ? 'A' : 'B';
            currentRound = 0;
            isBotResponding = false;

            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('chat-screen').style.display = 'block';
            document.getElementById('round-counter').textContent = `当前对话轮数：${currentRound}/${maxRounds}`;

            // 隐藏问卷提示框（如果之前显示过）
            document.getElementById('survey-prompt-box').style.display = 'none';

            const groupConfig = currentGroup === 'A' ? GROUP_A : GROUP_B;
            addMessage(groupConfig.greeting, 'bot');
        }

        function addMessage(content, sender) {
            const chatMessages = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            if (sender === 'user') {
                messageDiv.innerHTML = `<img src="${USER_AVATAR_URL}" class="avatar"><div class="message-content">${content}</div>`;
            } else {
                const groupConfig = currentGroup === 'A' ? GROUP_A : GROUP_B;
                if (groupConfig.avatarUrl) {
                    messageDiv.innerHTML = `<img src="${groupConfig.avatarUrl}" class="avatar"><div class="message-content">${content}</div>`;
                } else {
                    messageDiv.innerHTML = `<div class="avatar avatar-bot-B">⚙</div><div class="message-content">${content}</div>`;
                }
            }

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const sendBtn = document.getElementById('send-btn');
            const content = input.value.trim();

            if (!content || isBotResponding) return;

            input.value = '';
            isBotResponding = true;
            sendBtn.disabled = true;

            addMessage(content, 'user');

            try {
                const groupConfig = currentGroup === 'A' ? GROUP_A : GROUP_B;
                const response = await fetch(window.location.origin + '/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        messages: [
                            { role: 'system', content: groupConfig.systemPrompt },
                            { role: 'user', content: content }
                        ]
                    })
                });

                if (!response.ok) throw new Error(`API请求失败: ${response.status}`);

                const data = await response.json();
                if (!data.choices || !data.choices[0]) throw new Error('API返回错误');

                addMessage(data.choices[0].message.content, 'bot');
                currentRound++;
                document.getElementById('round-counter').textContent = `当前对话轮数：${currentRound}/${maxRounds}`;

                // 第六轮结束后显示问卷提示框
                if (currentRound >= maxRounds) {
                    document.getElementById('user-input').disabled = true;
                    sendBtn.disabled = true;

                    // 延迟1秒后显示粉色提示框
                    setTimeout(() => {
                        showSurveyPrompt();
                    }, 1000);
                }
            } catch (error) {
                addMessage(`错误: ${error.message}`, 'bot');
            } finally {
                isBotResponding = false;
                sendBtn.disabled = false;
            }
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }

        // 显示问卷提示框函数
        function showSurveyPrompt() {
            console.log('显示问卷提示框...');
            
            const promptBox = document.getElementById('survey-prompt-box');
            promptBox.style.display = 'block';

            // 滚动到底部让用户看到提示框
            promptBox.scrollIntoView({ behavior: 'smooth', block: 'end' });

            console.log('问卷提示框已显示！');
        }
    </script>
</body>
</html>
